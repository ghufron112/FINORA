<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="finoraGrad" x1="4" y1="44" x2="44" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background badge -->
  <rect width="48" height="48" rx="14" fill="#050B14"/>
  <rect x="1" y="1" width="46" height="46" rx="13" stroke="rgba(94, 234, 212, 0.2)" stroke-width="1.5"/>
  <!-- Leaf and wave upward curve -->
  <path d="M12 34C15 24 22 18 36 14C36 28 30 35 20 38C15 38 13 36 12 34Z" fill="url(#finoraGrad)" fill-opacity="0.85" filter="url(#glow)"/>
  <path d="M12 34C19 31 26 24 33 16" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Financial pulse dot -->
  <circle cx="34" cy="15" r="3.5" fill="#5EEAD4" filter="url(#glow)"/>
</svg>